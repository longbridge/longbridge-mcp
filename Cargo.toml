[package]
name = "longbridge-mcp"
version = "0.16.5"
edition = "2024"

[dependencies]
longbridge = "5.3"
longbridge-proto = "5.3"
rust_decimal = "1"
rmcp = { version = "1.4", features = [
    "server",
    "transport-streamable-http-server",
    "transport-io",
    "macros",
] }
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
    "signal",
    "process",
    "io-util",
] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_urlencoded = "0.7"
schemars = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
time = { version = "0.3", features = [
    "formatting",
    "parsing",
    "serde-human-readable",
] }
# Already in the tree via the longbridge SDK; used for US-market-local dates.
time-tz = "2.0.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots", "rustls-tls-native-roots", "http2", "charset"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
http-body-util = "0.1"
prometheus = "0.13"
thiserror = "2"
base64 = "0.22"
bs58 = "0.5"
axum-server = { version = "0.7", features = ["tls-rustls"] }
serde-transcode = "1.1"
anyhow = "1"
rustls = { version = "0.23", features = ["ring"] }
sha2 = "0.10"
futures-util = "0.3"

# Embedded jq-compatible response filtering (no external jq executable).
jaq-core = "3.1"
jaq-std = "3.0"
jaq-json = { version = "2.0", features = ["serde"] }

# Resource limits for the `_jq` sandbox worker process (safe wrapper, so the
# crate keeps `#![forbid(unsafe_code)]`).
[target.'cfg(unix)'.dependencies]
rlimit = "0.11"

# TEMPORARY: `TradeContext::risk_assessment` is not on crates.io yet. It is in
# longbridge/openapi#625, which is still unreleased — note that 5.4.0 is already
# published and does NOT contain it, so the requirements above must be bumped to
# whatever release ships it (not 5.4) when this patch is removed.
#
# Pinned by `rev`, not `branch`: a branch pin stops resolving once #625 merges
# and its branch is deleted; a warm ~/.cargo/git cache hides that locally, CI
# and release builds do not. The full 40-char SHA is preferred over an
# abbreviation because cargo can then fetch it directly by SHA instead of
# resolving the prefix first.
#
# NOTE: this patch is not only the new API — it also moves the SDK 5.3 -> 5.4
# (oauth2 4.4 -> 5.0, reqwest 0.11 -> 0.12, typed `Error::OAuth`), which is where
# most of the Cargo.lock churn comes from.
[patch.crates-io]
longbridge = { git = "https://github.com/longbridge/openapi", rev = "c0a8733753b40f6b745cb6f8ef47ed318ff8b6d5" }
longbridge-proto = { git = "https://github.com/longbridge/openapi", rev = "c0a8733753b40f6b745cb6f8ef47ed318ff8b6d5" }
